<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>機房接線</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css?v=11021138">
</head>
<body data-page="home">
<main class="wrap">
<div class="topbar"><span class="pill">RACK A · MADE BY 613 ✦</span><span class="pill" data-online-wrap hidden><i class="dot"></i><span data-online>1</span> 人在線</span></div>
<section class="hero">
  <div><h1>機房接線</h1><p class="sub">轉動網路線，<br>把交換器接到每一台伺服器。</p></div>
  <svg viewBox="0 0 130 120" aria-hidden="true">
<rect x="22" y="4" width="70" height="104" rx="8" fill="#232b40" stroke="#3a4560" stroke-width="2"/>
<g id="leds"></g>
<path d="M85 22c22 0 18 30 38 30" fill="none" stroke="#ffb547" stroke-width="4" stroke-linecap="round"/>
<path d="M85 45c18 0 16 40 34 44" fill="none" stroke="#5cc8ff" stroke-width="4" stroke-linecap="round"/>
<path d="M85 68c14 0 12 36 26 44" fill="none" stroke="#ff7eb6" stroke-width="4" stroke-linecap="round"/>
<path d="M8 20l3-6 3 6-6-3h6zM112 8l2-4 2 4-4-2h4z" fill="#ffe27a"/>
</svg>
</section>
<section class="card" aria-labelledby="progT">
  <h3 id="progT">📅 今日進度 · <span id="todayLbl"></span></h3>
  <div class="prog" id="prog"></div>
  <span id="streak"></span>
</section>
<nav class="modes" aria-label="模式">
  <a class="mode" href="daily.html" style="--m:var(--amber)"><span class="ic" data-ic="cal"></span><span><b>每日一題</b><small id="dailySub">每天四題，大家同一題</small></span><span class="arr">→</span></a>
  <a class="mode" href="practice.html" style="--m:var(--cyan)"><span class="ic" data-ic="tool"></span><span><b>自由練習</b><small>隨機出題、不計排名</small></span><span class="arr">→</span></a>
  <a class="mode" href="leaderboard.html" style="--m:var(--pink)"><span class="ic" data-ic="cup"></span><span><b>排行榜</b><small id="lbSub">看看今天誰最強</small></span><span class="arr">→</span></a>
  <a class="mode" href="howto.html" style="--m:var(--violet)"><span class="ic" data-ic="book"></span><span><b>玩法說明</b><small>第一次玩先看這裡</small></span><span class="arr">→</span></a>
</nav>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js"></script>
<script src="common.js?v=11021138"></script>
<script>
(()=>{
const {$,SIZES,today,dailyKey,ls,streak,sb,icon}=NP;
document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=icon(e.dataset.ic));
// 機櫃上的彩色指示燈
const c=['#ffb547','#5cc8ff','#ff7eb6','#b49cff'];let h='';
for(let i=0;i<4;i++){const y=12+i*23;h+=`<rect x="29" y="${y}" width="56" height="17" rx="3" fill="#2d3650"/><circle cx="37" cy="${y+8.5}" r="3" fill="${c[i]}"/><circle cx="46" cy="${y+8.5}" r="3" fill="${c[(i+1)%4]}" opacity=".6"/><rect x="56" y="${y+6}" width="22" height="5" rx="2" fill="#1a2030"/>`}
$('leds').innerHTML=h;
const d=today(); $('todayLbl').textContent=d.slice(5).replace('-','/');
let left=0;
$('prog').innerHTML=SIZES.map(n=>{const r=ls.get(dailyKey(d,n),null);if(!r)left++;
  return `<a href="daily.html?size=${n}" class="${r?'d':''}" aria-label="${n}×${n} ${r?'已完成':'還沒玩'}">${n}×${n}<b>${r?'✓':'—'}</b></a>`}).join('');
$('dailySub').textContent=left?`今天還剩 ${left} 題`:'今天全部完成 🎉 明天再來';
const s=streak(); $('streak').textContent=s?`🔥 連續 ${s} 天`:'完成一題每日一題，開始累積連續天數';
if(sb) sb.from('scores').select('id',{count:'exact',head:true}).eq('day',d).then(({count,error})=>{
  if(!error&&count!=null)$('lbSub').textContent=count?`今天已經有 ${count} 筆成績上榜`:'今天還沒有人上榜，搶第一！'});
})();
</script>
<script data-goatcounter="https://613chumi.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
