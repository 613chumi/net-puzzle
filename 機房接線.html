<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>機房接線</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 版面：上面工具列＋狀態，中間正方形機櫃面板，下面規則。像機房的配線架。 */
:root{
  --bg:#e7eaee; --panel:#f6f7f9; --ink:#1d242c; --mute:#5f6a76; --line:#cdd3da;
  --tile:#dfe4ea; --wire:#9aa4b0; --live:#1f8a55; --live-glow:rgba(31,138,85,.18);
  --switch:#c7811c; --lock:#3a5a8c; --hl:rgba(58,90,140,.12);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161b; --panel:#1a2027; --ink:#e3e8ee; --mute:#94a0ad; --line:#2c343e;
  --tile:#212831; --wire:#55606c; --live:#4fd88f; --live-glow:rgba(79,216,143,.16);
  --switch:#f0a943; --lock:#8fb3ea; --hl:rgba(143,179,234,.14); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161b; --panel:#1a2027; --ink:#e3e8ee; --mute:#94a0ad; --line:#2c343e;
  --tile:#212831; --wire:#55606c; --live:#4fd88f; --live-glow:rgba(79,216,143,.16);
  --switch:#f0a943; --lock:#8fb3ea; --hl:rgba(143,179,234,.14); color-scheme:dark}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6}
.wrap{max-width:620px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:16px}
header .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--mute)}
header h1{margin:0;font-size:clamp(28px,6vw,38px);font-weight:900;letter-spacing:.06em;text-wrap:balance}
header p{margin:2px 0 0;color:var(--mute)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--panel);color:var(--mute);font:600 13px var(--mono);padding:7px 11px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:7px 14px;font:500 14px var(--sans);cursor:pointer}
.btn:hover{border-color:var(--mute)}
button:focus-visible{outline:3px solid var(--lock);outline-offset:2px}
.status{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--mute)}
.status b{font-family:var(--mono);color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.rack{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;position:relative}
.board{display:grid;gap:3px;width:100%;aspect-ratio:1;max-width:100%}
.tile{appearance:none;border:0;padding:0;margin:0;background:var(--tile);border-radius:6px;cursor:pointer;position:relative;min-width:0;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tile:hover{box-shadow:inset 0 0 0 2px var(--line)}
.tile.locked{background:var(--hl);box-shadow:inset 0 0 0 2px var(--lock)}
.tile.lit{background:color-mix(in srgb,var(--tile) 82%,var(--live) 18%)}
.tile.locked.lit{background:color-mix(in srgb,var(--hl) 70%,var(--live) 18%)}
.tile svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .16s ease-out}
.tile svg.ic{transition:none}
.tile .w{stroke:var(--wire);stroke-width:13;stroke-linecap:round;fill:none}
.tile.lit .w{stroke:var(--live)}
.tile .hub{fill:var(--wire)}
.tile.lit .hub{fill:var(--live)}
.tile .srv{fill:var(--panel);stroke:var(--wire);stroke-width:5}
.tile.lit .srv{stroke:var(--live)}
.tile .led{fill:var(--wire)}
.tile.lit .led{fill:var(--live)}
.tile .sw{fill:var(--switch)}
.tile .swp{fill:var(--panel)}
.done .tile{cursor:default}
.win{position:absolute;inset:12px;display:grid;place-items:center;pointer-events:none}
.win .card{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 22px;text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,.18);display:grid;gap:6px;max-width:90%}
.win h2{margin:0;font-size:22px}
.win p{margin:0;color:var(--mute);font-size:14px}
.win .btn{justify-self:center;margin-top:6px;background:var(--live);color:var(--panel);border-color:var(--live);font-weight:700}
.rules{font-size:14px;color:var(--mute);display:grid;gap:4px}
.rules h2{font-size:15px;color:var(--ink);margin:0 0 2px}
.rules ul{margin:0;padding-left:18px;display:grid;gap:2px}
.kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px}
@media (prefers-reduced-motion: reduce){.tile svg{transition:none}}
</style>
<style>body{margin:0}</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">RACK A · PATCH PANEL</div>
    <h1>機房接線</h1>
    <p>轉動每一格網路線，讓中間的交換器接到所有伺服器。</p>
  </header>

  <div class="tools">
    <div class="seg" id="sizes" role="group" aria-label="大小">
      <button type="button" data-n="5">5×5</button><button type="button" data-n="6">6×6</button><button type="button" data-n="7">7×7</button><button type="button" data-n="9">9×9</button>
    </div>
    <button class="btn" id="newBtn" type="button">新題目</button>
    <button class="btn" id="hintBtn" type="button">提示</button>
  </div>

  <div class="status" aria-live="polite">
    <span>連線中 <b id="sOn">0</b> / <b id="sAll">0</b> 台</span>
    <span>轉了 <b id="sMoves">0</b> 下</span>
    <span>提示 <b id="sHints">0</b></span>
    <span>這個大小最佳 <b id="sBest">—</b></span>
  </div>

  <div class="rack">
    <div class="board" id="board"></div>
    <div class="win" id="win" hidden>
      <div class="card">
        <h2>全部連線 ✓</h2>
        <p id="winText"></p>
        <button class="btn" id="againBtn" type="button">下一題</button>
      </div>
    </div>
  </div>

  <section class="rules">
    <h2>怎麼玩</h2>
    <ul>
      <li>點一下格子：順時針轉 90°。</li>
      <li>右鍵或長按：鎖定格子（確定方向的先鎖起來，就不會誤點）。</li>
      <li>綠色代表已經接到交換器。所有伺服器都亮、而且沒有線頭露在外面就過關。</li>
      <li>小技巧：邊框上的線頭不能朝外；伺服器不能接伺服器。</li>
      <li>鍵盤：<span class="kbd">↑↓←→</span> 移動、<span class="kbd">空白鍵</span> 或 <span class="kbd">Enter</span> 旋轉、<span class="kbd">L</span> 鎖定。</li>
    </ul>
  </section>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const N=1,E=2,S=4,W=8, DIRS=[[N,0,-1,S],[E,1,0,W],[S,0,1,N],[W,-1,0,E]];
const rot=m=>((m<<1)|(m>>3))&15;
const ls={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let n=ls.get('netSize',5), sol=[], cur=[], turns=[], locked=[], moves=0, hints=0, solved=false, cx=0, cy=0;

/* 產生題目：從中間的交換器長出一棵隨機樹，葉子是伺服器 */
function generate(){
  const T=n*n; sol=new Array(T).fill(0);
  cx=Math.floor(n/2); cy=Math.floor(n/2);
  const inT=new Array(T).fill(false); inT[cy*n+cx]=true;
  const deg=new Array(T).fill(0);
  let frontier=[]; const addF=i=>{const x=i%n,y=(i/n)|0;
    for(const [b,dx,dy,o] of DIRS){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=n||ny>=n)continue;const j=ny*n+nx;if(!inT[j])frontier.push([i,j,b,o])}};
  addF(cy*n+cx);
  let count=1;
  while(count<T){
    frontier=frontier.filter(f=>!inT[f[1]]);
    // 偏好不要長出十字路口
    let cand=frontier.filter(f=>deg[f[0]]<3);
    if(!cand.length)cand=frontier;
    const [i,j,b,o]=cand[Math.floor(Math.random()*cand.length)];
    sol[i]|=b; sol[j]|=o; deg[i]++; deg[j]++; inT[j]=true; count++; addF(j);
  }
  cur=sol.slice(); turns=new Array(T).fill(0); locked=new Array(T).fill(false);
  for(let i=0;i<T;i++){
    let r=Math.floor(Math.random()*4);
    const m=sol[i]; if(m===5||m===10) r=r%2||1; // 直線轉 180° 等於沒轉
    for(let k=0;k<r;k++)cur[i]=rot(cur[i]);
    turns[i]=r;
  }
  if(isSolved())return generate();
  moves=0;hints=0;solved=false;
}

/* 從交換器開始找接得上的格子 */
function powered(){
  const lit=new Array(n*n).fill(false), st=[cy*n+cx]; lit[st[0]]=true;
  while(st.length){const i=st.pop(),x=i%n,y=(i/n)|0;
    for(const [b,dx,dy,o] of DIRS){if(!(cur[i]&b))continue;const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=n||ny>=n)continue;const j=ny*n+nx;
      if((cur[j]&o)&&!lit[j]){lit[j]=true;st.push(j)}}}
  return lit;
}
function isSolved(){
  for(let i=0;i<n*n;i++){const x=i%n,y=(i/n)|0;
    for(const [b,dx,dy,o] of DIRS){if(!(cur[i]&b))continue;const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=n||ny>=n)return false;if(!(cur[ny*n+nx]&o))return false}}
  return powered().every(Boolean);
}

/* 畫格子：畫「正確方向」的形狀，再用 CSS 旋轉到目前角度 */
function svgFor(i){
  const m=sol[i], isSw=i===cy*n+cx, d=[(m&N)&&1,(m&E)&&1,(m&S)&&1,(m&W)&&1].reduce((a,b)=>a+b,0), leaf=d===1&&!isSw;
  let p='';
  const end={[N]:'50,0',[E]:'100,50',[S]:'50,100',[W]:'0,50'};
  for(const b of [N,E,S,W]) if(m&b) p+=`<line class="w" x1="50" y1="50" x2="${end[b].split(',')[0]}" y2="${end[b].split(',')[1]}"/>`;
  // 交換器和伺服器的圖示放在不會轉的那一層，永遠是正的
  let icon='';
  if(isSw) icon=`<rect class="sw" x="22" y="30" width="56" height="40" rx="6"/>`+[32,44,56,68].map(x=>`<rect class="swp" x="${x-4}" y="44" width="8" height="10" rx="1"/>`).join('');
  else if(leaf) icon=`<rect class="srv" x="27" y="27" width="46" height="46" rx="6"/><line class="w" x1="36" y1="43" x2="54" y2="43" style="stroke-width:5"/><line class="w" x1="36" y1="57" x2="54" y2="57" style="stroke-width:5"/><circle class="led" cx="63" cy="43" r="4"/>`;
  else if(d>=3) p+=`<circle class="hub" cx="50" cy="50" r="11"/>`;
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${p}</svg>`+(icon?`<svg class="ic" viewBox="0 0 100 100" aria-hidden="true">${icon}</svg>`:'');
}
// 每格要轉回正確方向還差幾下；畫面角度 = -(差的步數) × 90°
let shown=[];
function build(){
  const b=$('board'); b.style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;
  b.innerHTML=''; shown=[]; focusI=cy*n+cx;
  for(let i=0;i<n*n;i++){
    const t=document.createElement('button');t.type='button';t.className='tile';t.dataset.i=i;
    t.setAttribute('aria-label',`第 ${((i/n)|0)+1} 列第 ${i%n+1} 格`);
    t.innerHTML=svgFor(i); t.tabIndex=i===cy*n+cx?0:-1; b.appendChild(t);
    shown[i]=turns[i]*90;
    t.firstChild.style.transform=`rotate(${shown[i]}deg)`;
  }
  $('win').hidden=true; b.parentElement.classList.remove('done');
  document.querySelectorAll('#sizes button').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.n===n));
  $('sBest').textContent=ls.get('netBest'+n,null)??'—';
  refresh();
}
function refresh(){
  const lit=powered(); let on=0,all=0;
  [...$('board').children].forEach((t,i)=>{
    t.classList.toggle('lit',lit[i]); t.classList.toggle('locked',locked[i]);
    const d=[N,E,S,W].filter(b=>sol[i]&b).length;
    if(d===1&&i!==cy*n+cx){all++;if(lit[i])on++}
  });
  $('sOn').textContent=on;$('sAll').textContent=all;$('sMoves').textContent=moves;$('sHints').textContent=hints;
  if(!solved&&isSolved())win();
}
function turn(i){
  if(solved||locked[i])return;
  cur[i]=rot(cur[i]); turns[i]=(turns[i]+1)%4; moves++;
  shown[i]+=90; $('board').children[i].firstChild.style.transform=`rotate(${shown[i]}deg)`;
  refresh();
}
function toggleLock(i){ if(solved)return; locked[i]=!locked[i]; refresh(); }
function win(){
  solved=true; $('board').parentElement.classList.add('done');
  const key='netBest'+n, best=ls.get(key,null);
  let msg=`${n}×${n} · 轉了 ${moves} 下`+(hints?` · 用了 ${hints} 次提示`:'');
  if(!hints&&(best===null||moves<best)){ls.set(key,moves);msg+=' · 新紀錄！';$('sBest').textContent=moves}
  $('winText').textContent=msg; $('win').hidden=false; $('againBtn').focus({preventScroll:true});
  locked.fill(false); [...$('board').children].forEach(t=>t.classList.remove('locked'));
}
function hint(){
  if(solved)return;
  // 找一格方向不對的（包含被鎖錯的），轉正並鎖住
  const bad=[];for(let i=0;i<n*n;i++)if(cur[i]!==sol[i])bad.push(i);
  if(!bad.length)return;
  const i=bad[Math.floor(Math.random()*bad.length)];
  while(cur[i]!==sol[i]){cur[i]=rot(cur[i]);turns[i]=(turns[i]+1)%4;shown[i]+=90}
  $('board').children[i].firstChild.style.transform=`rotate(${shown[i]}deg)`;
  locked[i]=true; hints++; refresh();
}

/* 操作：點擊旋轉、右鍵／長按鎖定 */
const board=$('board'); let press=null, skipClick=false;
board.addEventListener('pointerdown',e=>{const t=e.target.closest('.tile');if(!t||e.button!==0)return;
  skipClick=false; press=setTimeout(()=>{skipClick=true;toggleLock(+t.dataset.i)},450)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>board.addEventListener(ev,()=>clearTimeout(press)));
board.addEventListener('click',e=>{const t=e.target.closest('.tile');if(!t)return;if(skipClick){skipClick=false;return}turn(+t.dataset.i)});
board.addEventListener('contextmenu',e=>{const t=e.target.closest('.tile');if(!t)return;e.preventDefault();clearTimeout(press);toggleLock(+t.dataset.i)});
// 方向鍵在格子之間移動（只有目前那格可以 Tab 進來）
let focusI=0;
function focusTile(i){const tiles=$('board').children;if(!tiles[i])return;
  tiles[focusI]&&(tiles[focusI].tabIndex=-1);focusI=i;tiles[i].tabIndex=0;tiles[i].focus({preventScroll:false})}
const MOVES={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
board.addEventListener('keydown',e=>{const t=e.target.closest('.tile');if(!t)return;
  const i=+t.dataset.i;
  if(e.key==='l'||e.key==='L'){e.preventDefault();toggleLock(i);return}
  const m=MOVES[e.key];if(!m)return;e.preventDefault();
  const x=Math.min(n-1,Math.max(0,i%n+m[0])),y=Math.min(n-1,Math.max(0,((i/n)|0)+m[1]));
  focusTile(y*n+x)});
board.addEventListener('focusin',e=>{const t=e.target.closest('.tile');if(t&&+t.dataset.i!==focusI)focusTile(+t.dataset.i)});
document.addEventListener('keydown',e=>{
  if(!MOVES[e.key]||e.target.closest?.('#board')||e.altKey||e.ctrlKey||e.metaKey)return;
  if(solved)return;e.preventDefault();focusTile(focusI)});

$('sizes').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;n=+b.dataset.n;ls.set('netSize',n);generate();build()});
$('newBtn').addEventListener('click',()=>{generate();build()});
$('againBtn').addEventListener('click',()=>{generate();build()});
$('hintBtn').addEventListener('click',hint);

if(![5,6,7,9].includes(n))n=5;
generate();build();
})();
</script>

</body>
</html>
